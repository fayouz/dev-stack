# Point d'entrée de la stack (make start, WUD, Dockge) : les services sont répartis
# par fonction dans compose/, assemblés ici. Chaque fichier déclare les réseaux et
# volumes qu'il utilise ; project_directory garde les chemins relatifs à la racine.
#
# Réseau partagé (stack_network) avec les projets routés par Traefik. Son nom vient
# de STACK_NETWORK (.env) : bme_network par défaut, profil BME (réseau rejoint par
# Plumo, Docus...) ; un autre nom (ex. devstack) pour le profil générique.
include:
  - path: compose/proxy.yaml
    project_directory: .
  - path: compose/databases.yaml
    project_directory: .
  - path: compose/monitoring.yaml
    project_directory: .
  - path: compose/backups.yaml
    project_directory: .
  - path: compose/hoppscotch.yaml
    project_directory: .
  - path: compose/tools.yaml
    project_directory: .
  - path: compose/dashboard.yaml
    project_directory: .
