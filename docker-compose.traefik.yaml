services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=true"
      - "--api.insecure=true" # ⚠ accès libre, à retirer en prod
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:9001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "glance.name=Traefik"
      - "glance.icon=si:traefikproxy"
      - "glance.url=http://traefik.local"
      - "glance.description=Reverse Proxy"
      - "glance.id=traefik"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bme_network
      - bme_network_aux
  # Portainer UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.local`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "glance.name=Portainer"
      - "glance.icon=si:portainer"
      - "glance.url=http://portainer.local"
      - "glance.description=Container Management"
      - "glance.id=portainer"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - bme_network
      - bme_network_aux
  adminer:
    image: adminer:latest
    container_name: adminer
    networks:
      - bme_network
      - bme_network_aux
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.local`)"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
  docus:
    build:
      context: ./docus
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - NO_PROXY=localhost,127.0.0.1,::1
    volumes:
      - ./docus/app:/home/nodeuser/my-app
      - ./docus/scripts/start.sh:/usr/local/bin/start.sh:rw
      - /home/pinf14/projects/RegazLink/docs:/home/nodeuser/my-app/content/regazlink:rw

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docus.rule=Host(`docus.local`)"
      - "traefik.http.services.docus.loadbalancer.server.port=3000"
      # Support WebSocket

    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=localhost,127.0.0.1,::1
      - MANUAL_INSTALL=1

    restart: unless-stopped
    networks:
      - bme_network
      - bme_network_aux
  oracle:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-password}
      APP_USER: ${ORACLE_USER:-RGZ}
      APP_USER_PASSWORD: ${ORACLE_USER_PASSWORD:-password}
      NLS_LANG: FRENCH_FRANCE.AL32UTF8
    ports:
      - "1521:1521"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oracle.rule=Host(`oracle.local`)"
      - "traefik.http.services.oracle.loadbalancer.server.port=1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - bme_network
      - bme_network_aux
  mailer:
    container_name: mailer
    image: sj26/mailcatcher:v0.10.0
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailer.rule=Host(`mailer.local`)"
      - "traefik.http.services.mailer.loadbalancer.server.port=1080"
    networks:
      - bme_network
      - bme_network_aux
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./mnt/glance/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bme_network
      - bme_network_aux
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`glance.local`)"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
  organizr:
    image: organizr/organizr
    container_name: organizr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - organizer_data:/config
    restart: unless-stopped
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.organizr.rule=Host(`organizr.local`)"
      - "traefik.http.services.organizr.loadbalancer.server.port=80"
    networks:
      - bme_network
      - bme_network_aux
volumes:
  portainer_data:
  organizer_data:
  oracle_data:

networks:
  bme_network:
    external: true
  bme_network_aux:
    external: true
