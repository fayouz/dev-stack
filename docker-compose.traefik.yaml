services:

  # Seul conteneur (avec Portainer) à monter le socket Docker.
  # Expose l'API en lecture seule (POST=0) sur le réseau interne socket_proxy.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped

    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - INFO=1
      - EVENTS=1
      - VERSION=1
      - PING=1
      - POST=0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - socket_proxy

  # N'autorise que start/stop/restart d'un conteneur existant (ni liste,
  # ni création, ni exec, ni pull). Utilisé par le dashboard uniquement.
  docker-socket-proxy-actions:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-actions
    restart: unless-stopped

    environment:
      - POST=1
      - CONTAINERS=0
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - socket_proxy_actions

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.network=bme_network"

      - "--api.dashboard=true"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.asDefault=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"

      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"

      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

    ports:
      - "80:80"
      - "443:443"

    environment:
      - DOCKER_API_VERSION=1.40

    volumes:
      - ./letsencrypt:/letsencrypt
      - ./mnt/traefik/dynamic:/etc/traefik/dynamic:ro
      # Seulement le certificat serveur : la clé de l'autorité reste dans mnt/certs/ca
      - ./mnt/certs/server:/certs:ro

    depends_on:
      - docker-socket-proxy

    labels:
      - "dashboard.category=stack"

      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`local-traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=tinyauth"
      # Défini ici (et non sur tinyauth) pour exister même quand tinyauth redémarre :
      # l'accès reste alors fermé au lieu de casser les routeurs
      - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
      - "traefik.http.middlewares.tinyauth.forwardauth.authResponseHeaders=Remote-User,Remote-Email,Remote-Name,Remote-Groups"
      # HTTPS pour la dev-stack uniquement (*.${DOMAIN}) : les autres projets
      # (*.localhost) gardent leur HTTP. Redirection temporaire (302) : rien n'est
      # mémorisé par le navigateur, on peut revenir en arrière sans effet de bord.
      - "traefik.http.middlewares.to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.dev-stack-to-https.rule=HostRegexp(`^.+\\.${DOMAIN}$$`)"
      - "traefik.http.routers.dev-stack-to-https.entrypoints=web"
      - "traefik.http.routers.dev-stack-to-https.priority=1"
      - "traefik.http.routers.dev-stack-to-https.middlewares=to-https"
      - "traefik.http.routers.dev-stack-to-https.service=noop@internal"

      - "glance.name=Traefik"
      - "glance.icon=si:traefikproxy"
      - "glance.url=https://local-traefik.${DOMAIN}"
      - "glance.description=Reverse Proxy"
      - "glance.id=traefik"

      - "wud.watch=true"
      - "wud.tag.include=^v3\\.\\d+$$"

    networks:
      bme_network:
        # Les conteneurs (Portainer, WUD) joignent l'émetteur OIDC par son nom public
        aliases:
          - ${SUBDOMAIN}-auth.${DOMAIN}
      socket_proxy: {}

  # Portainer garde le socket direct : il a besoin de l'API en écriture
  # (POST, exec, volumes...), un proxy n'apporterait aucune restriction.
  portainer:
    image: portainer/portainer-ce:2.45.2
    container_name: portainer
    restart: unless-stopped

    environment:
      # Autorités système + autorité locale, pour joindre tinyauth (OAuth) en HTTPS
      - SSL_CERT_DIR=/etc/ssl/certs:/certs-ca

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mnt/portainer/data:/data
      - ./mnt/certs/ca/ca.crt:/certs-ca/docker-master-ca.crt:ro

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${SUBDOMAIN}-portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

      - "glance.name=Portainer"
      - "glance.icon=si:portainer"
      - "glance.url=https://${SUBDOMAIN}-portainer.${DOMAIN}"
      - "glance.description=Container Management"
      - "glance.id=portainer"

      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  adminer:
    image: adminer:latest
    container_name: adminer

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`${SUBDOMAIN}-adminer.${DOMAIN}`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.middlewares=tinyauth"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

      - "glance.name=Adminer"
      - "glance.icon=si:adminer"
      - "glance.url=https://${SUBDOMAIN}-adminer.${DOMAIN}"
      - "glance.description=Database Client"
      - "glance.id=adminer"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  mariadb:
    image: mariadb:12.2
    container_name: mariadb
    restart: unless-stopped
    stop_grace_period: 1m

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-db_master}
      MARIADB_USER: ${MARIADB_USER:-admin}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-password}

    volumes:
      - ./mnt/mariadb/data:/var/lib/mysql
      - ./mnt/mariadb/config:/etc/mysql/conf.d

    labels:
      - "dashboard.category=stack"

      - "glance.name=MariaDB"
      - "glance.icon=si:mariadb"
      - "glance.description=SQL Database"
      - "glance.id=mariadb"

      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+$$"

    networks:
      - bme_network

  # EN PAUSE : base corrompue (ORA-01578 dans system01.dbf), copie du volume dans
  # docker-master_oracle_data_copie_20260929. Hors du démarrage automatique
  # (profil on-demand) en attendant la décision : réparer ou recréer à vide.
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    restart: "no"
    profiles: ["on-demand"]
    # Oracle a besoin de plus que les 10 s par défaut pour s'arrêter proprement
    stop_grace_period: 2m

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-password}
      APP_USER: ${ORACLE_USER:-RGZ}
      APP_USER_PASSWORD: ${ORACLE_USER_PASSWORD:-password}
      NLS_LANG: FRENCH_FRANCE.AL32UTF8

    ports:
      - "1521:1521"

    volumes:
      - oracle_data:/opt/oracle/oradata

    labels:
      - "dashboard.category=stack"
      - "dashboard.on-demand=true"

      - "glance.name=Oracle XE"
      - "glance.icon=si:oracle"
      - "glance.description=Oracle Database"
      - "glance.id=oracle"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  mailer:
    image: axllent/mailpit:latest
    container_name: mailer
    restart: unless-stopped

    ports:
      - "1025:1025"

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.mailer.rule=Host(`${SUBDOMAIN}-mailer.${DOMAIN}`)"
      - "traefik.http.routers.mailer.entrypoints=websecure"
      - "traefik.http.routers.mailer.tls=true"
      - "traefik.http.routers.mailer.middlewares=tinyauth"
      - "traefik.http.services.mailer.loadbalancer.server.port=8025"

      - "glance.name=Mailpit"
      - "glance.icon=si:mailtrap"
      - "glance.url=https://${SUBDOMAIN}-mailer.${DOMAIN}"
      - "glance.description=Mail Catcher"
      - "glance.id=mailpit"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  glance:
    image: glanceapp/glance
    container_name: glance
    restart: unless-stopped

    environment:
      - DOCKER_API_VERSION=1.40

    volumes:
      - ./mnt/glance/config:/app/config

    depends_on:
      - docker-socket-proxy

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`${SUBDOMAIN}-glance.${DOMAIN}`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls=true"
      - "traefik.http.routers.glance.middlewares=tinyauth"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network
      - socket_proxy

  organizr:
    image: organizr/organizr
    container_name: organizr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris

    volumes:
      - ./mnt/organizr/config:/config

    depends_on:
      - mariadb

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.organizr.rule=Host(`${SUBDOMAIN}-organizr.${DOMAIN}`)"
      - "traefik.http.routers.organizr.entrypoints=websecure"
      - "traefik.http.routers.organizr.tls=true"
      - "traefik.http.services.organizr.loadbalancer.server.port=80"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  # À la demande : Dozzle diffuse en continu les statistiques de tous les
  # conteneurs (~20 % de CPU pour dockerd et autant pour containerd), sans
  # option pour le couper. Hors du démarrage automatique (profil on-demand) :
  # à lancer depuis la page Services du dashboard, ou `make dozzle`.
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: "no"
    profiles: ["on-demand"]

    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DOZZLE_NO_ANALYTICS=true

    depends_on:
      - docker-socket-proxy

    labels:
      - "dashboard.category=tools"
      - "dashboard.on-demand=true"

      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${SUBDOMAIN}-dozzle.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.middlewares=tinyauth"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

      - "glance.name=Dozzle"
      - "glance.icon=si:docker"
      - "glance.url=https://${SUBDOMAIN}-dozzle.${DOMAIN}"
      - "glance.description=Docker Logs"
      - "glance.id=dozzle"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network
      - socket_proxy

  # Suivi et application des mises à jour d'images. Alerte dans Mailpit ;
  # la mise à jour se lance à la main depuis l'interface WUD (AUTO=false) :
  # WUD réécrit le tag dans ce fichier compose puis recrée le conteneur.
  # Socket direct : pull + recréation = accès complet à l'API, un proxy
  # n'apporterait aucune restriction (même exception que Portainer).
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped

    environment:
      - TZ=Europe/Paris
      - WUD_AUTH_ADMIN_USER=admin
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_ADMIN_PASSWORD:-admin}
      # Connexion via tinyauth (OIDC). Le compte local ci-dessus reste pour l'API (dashboard).
      - WUD_PUBLIC_URL=https://${SUBDOMAIN}-wud.${DOMAIN}
      - WUD_AUTH_OIDC_TINYAUTH_DISCOVERY=https://${SUBDOMAIN}-auth.${DOMAIN}/.well-known/openid-configuration
      - WUD_AUTH_OIDC_TINYAUTH_CLIENTID=wud
      - WUD_AUTH_OIDC_TINYAUTH_CLIENTSECRET=${TINYAUTH_OIDC_WUD_SECRET}
      - WUD_AUTH_OIDC_TINYAUTH_REDIRECT=true
      # Rôle admin pour l'utilisateur tinyauth "admin" (les comptes locaux de tinyauth
      # n'ont pas de groupes : le nom d'utilisateur sert de groupe) ; les autres sont refusés
      - WUD_AUTH_OIDC_TINYAUTH_GROUPSCLAIM=preferred_username
      - WUD_AUTH_OIDC_TINYAUTH_ADMINGROUP=admin
      - WUD_AUTH_OIDC_TINYAUTH_DEFAULTROLE=none
      - NODE_EXTRA_CA_CERTS=/certs-ca/ca.crt
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
      - WUD_WATCHER_LOCAL_CRON=${WUD_CRON:-0 12 * * *}
      - WUD_TRIGGER_SMTP_MAILPIT_HOST=mailer
      - WUD_TRIGGER_SMTP_MAILPIT_PORT=1025
      - WUD_TRIGGER_SMTP_MAILPIT_FROM_ADDRESS=wud@docker-master.local
      - WUD_TRIGGER_SMTP_MAILPIT_TO=dev@docker-master.local
      - WUD_TRIGGER_SMTP_MAILPIT_ALLOWCUSTOMTLD=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_FILE=/project/docker-compose.traefik.yaml
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_AUTO=false
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_BACKUP=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_PRUNE=true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mnt/wud/store:/store
      # Autorité locale (certificat public seulement) pour joindre tinyauth en HTTPS
      - ./mnt/certs/ca/ca.crt:/certs-ca/ca.crt:ro
      - .:/project

    depends_on:
      - mailer

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`${SUBDOMAIN}-wud.${DOMAIN}`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.routers.wud.tls=true"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"

      - "glance.name=WUD"
      - "glance.icon=si:docker"
      - "glance.url=https://${SUBDOMAIN}-wud.${DOMAIN}"
      - "glance.description=Image Updates"
      - "glance.id=wud"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    # Plafond CPU : sans lui, cAdvisor a déjà saturé 4 cœurs sur 6 sous WSL
    cpus: 1.0

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--max_housekeeping_interval=60s"
      # Seuls CPU, mémoire et réseau servent (dashboard, Grafana). Le calcul de
      # l'espace disque des conteneurs (du sur chaque couche) est ruineux sous WSL.
      - "--disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"

    devices:
      - /dev/kmsg

    # Le healthcheck de l'image v0.60.6 passe à wget une option inconnue de BusyBox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    mem_limit: 64m

    command:
      - "--path.rootfs=/host"

    volumes:
      - /:/host:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"

    volumes:
      - ./mnt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    labels:
      - "dashboard.category=stack"

      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${SUBDOMAIN}-prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=tinyauth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

      - "glance.name=Prometheus"
      - "glance.icon=si:prometheus"
      - "glance.url=https://${SUBDOMAIN}-prometheus.${DOMAIN}"
      - "glance.description=Metrics"
      - "glance.id=prometheus"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://${SUBDOMAIN}-grafana.${DOMAIN}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Login unique : Grafana fait confiance à l'utilisateur transmis par tinyauth
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true

    volumes:
      - ./mnt/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./mnt/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${SUBDOMAIN}-grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=tinyauth"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

      - "glance.name=Grafana"
      - "glance.icon=si:grafana"
      - "glance.url=https://${SUBDOMAIN}-grafana.${DOMAIN}"
      - "glance.description=Dashboards"
      - "glance.id=grafana"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  # Sauvegardes chiffrées. MariaDB est sauvegardée par dump (cohérent),
  # Oracle via `make backup-oracle` (export Data Pump déposé dans mnt/restic/dumps).
  restic:
    build: ./mnt/restic
    image: docker-master/restic:local
    container_name: restic
    # Nom d'hôte fixe : restic regroupe les snapshots par hôte pour la rétention
    hostname: docker-master
    restart: unless-stopped

    environment:
      - TZ=Europe/Paris
      - RESTIC_REPOSITORY=/repo
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_CRON=${RESTIC_CRON:-30 12 * * *}
      - RESTIC_CHECK_CRON=${RESTIC_CHECK_CRON:-0 13 * * 1}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root}
      - BACKUP_MAIL_FROM=restic@docker-master.local
      - BACKUP_MAIL_TO=dev@docker-master.local
      - HEALTHCHECKS_PING_KEY=${HEALTHCHECKS_PING_KEY:-}

    volumes:
      - ./mnt/portainer/data:/source/portainer:ro
      - ./mnt/restic/dumps:/source/oracle-dumps:ro
      - ./mnt/restic/status:/status
      - ${RESTIC_REPOSITORY_PATH:-./mnt/restic/repo}:/repo

    depends_on:
      - mariadb

    labels:
      - "dashboard.category=stack"

      - "glance.name=Restic"
      - "glance.icon=si:restic"
      - "glance.description=Backups"
      - "glance.id=restic"

    networks:
      - bme_network

  # Login unique pour les outils web (forward-auth Traefik) : ajouter le
  # middleware `tinyauth` à un router pour le protéger. Session partagée
  # entre les sous-domaines de ${DOMAIN}, qui doit avoir deux niveaux
  # (ex. dev.localhost) : les navigateurs refusent un cookie sur "localhost".
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    container_name: tinyauth
    restart: unless-stopped

    environment:
      - TINYAUTH_APPURL=https://${SUBDOMAIN}-auth.${DOMAIN}
      - TINYAUTH_AUTH_USERS=${TINYAUTH_USERS}
      - TINYAUTH_DATABASE_PATH=/data/tinyauth.db
      - TINYAUTH_UI_TITLE=Docker Master
      - TINYAUTH_UI_WARNINGSENABLED=false
      - TINYAUTH_AUTH_TRUSTEDPROXIES=172.25.0.0/24
      - TINYAUTH_AUTH_SECURECOOKIE=true
      # Fournisseur OIDC : connexion automatique de Portainer et WUD (HTTPS requis)
      - TINYAUTH_OIDC_PRIVATEKEYPATH=/data/oidc_key
      - TINYAUTH_OIDC_PUBLICKEYPATH=/data/oidc_key.pub
      - TINYAUTH_OIDC_CLIENTS_PORTAINER_CLIENTID=portainer
      - TINYAUTH_OIDC_CLIENTS_PORTAINER_CLIENTSECRET=${TINYAUTH_OIDC_PORTAINER_SECRET}
      - TINYAUTH_OIDC_CLIENTS_PORTAINER_TRUSTEDREDIRECTURIS=https://${SUBDOMAIN}-portainer.${DOMAIN}
      - TINYAUTH_OIDC_CLIENTS_PORTAINER_NAME=Portainer
      - TINYAUTH_OIDC_CLIENTS_WUD_CLIENTID=wud
      - TINYAUTH_OIDC_CLIENTS_WUD_CLIENTSECRET=${TINYAUTH_OIDC_WUD_SECRET}
      - TINYAUTH_OIDC_CLIENTS_WUD_TRUSTEDREDIRECTURIS=https://${SUBDOMAIN}-wud.${DOMAIN}/auth/oidc/tinyauth/cb
      - TINYAUTH_OIDC_CLIENTS_WUD_NAME=WUD

    volumes:
      - ./mnt/tinyauth/data:/data

    labels:
      - "dashboard.category=stack"

      - "traefik.enable=true"
      - "traefik.http.routers.tinyauth.rule=Host(`${SUBDOMAIN}-auth.${DOMAIN}`)"
      - "traefik.http.routers.tinyauth.entrypoints=websecure"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"

      - "wud.watch=true"
      - "wud.tag.include=^v\\d+$$"

    networks:
      - bme_network

  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`${SUBDOMAIN}-it-tools.${DOMAIN}`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls=true"
      - "traefik.http.routers.it-tools.middlewares=tinyauth"
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"

      - "glance.name=IT Tools"
      - "glance.icon=si:toolbox"
      - "glance.url=https://${SUBDOMAIN}-it-tools.${DOMAIN}"
      - "glance.description=Dev Utilities"
      - "glance.id=it-tools"

      - "wud.watch=true"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  # Client d'API (façon Postman). Tout est servi sur une URL : / (appli),
  # /admin (configuration : auth, SMTP → Mailpit) et /backend.
  # Les migrations de la base s'exécutent à chaque démarrage (idempotentes).
  hoppscotch:
    image: hoppscotch/hoppscotch:2026.9.0
    container_name: hoppscotch
    restart: unless-stopped
    entrypoint: ["tini", "--"]
    command:
      - sh
      - -c
      - cd /dist/backend && node node_modules/prisma/build/index.js migrate deploy && exec node /usr/src/app/aio_run.mjs

    environment:
      - DATABASE_URL=postgresql://hoppscotch:${HOPPSCOTCH_DB_PASSWORD}@hoppscotch-db:5432/hoppscotch
      - DATA_ENCRYPTION_KEY=${HOPPSCOTCH_ENCRYPTION_KEY}
      - ENABLE_SUBPATH_BASED_ACCESS=true
      - TRUST_PROXY=true
      - WHITELISTED_ORIGINS=https://${SUBDOMAIN}-hoppscotch.${DOMAIN},app://localhost_3200,app://hoppscotch
      - VITE_BASE_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}
      - VITE_SHORTCODE_BASE_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}
      - VITE_ADMIN_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/admin
      - VITE_BACKEND_GQL_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/graphql
      - VITE_BACKEND_WS_URL=wss://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/graphql
      - VITE_BACKEND_API_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/v1

    depends_on:
      hoppscotch-db:
        condition: service_healthy

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.hoppscotch.rule=Host(`${SUBDOMAIN}-hoppscotch.${DOMAIN}`)"
      - "traefik.http.routers.hoppscotch.entrypoints=websecure"
      - "traefik.http.routers.hoppscotch.tls=true"
      - "traefik.http.services.hoppscotch.loadbalancer.server.port=80"

      - "glance.name=Hoppscotch"
      - "glance.icon=si:hoppscotch"
      - "glance.url=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}"
      - "glance.description=API Client"
      - "glance.id=hoppscotch"

      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  # Synchronisation continue des fichiers .http JetBrains des projets vers
  # Hoppscotch (sens unique : les fichiers font foi). Projets montés en lecture
  # seule ; session Hoppscotch de HOPP_EMAIL ouverte par lien magique lu dans
  # Mailpit. Ne touche qu'aux collections et environnements qu'il a créés.
  hoppscotch-sync:
    build: ./mnt/hoppscotch-sync
    image: docker-master/hoppscotch-sync:local
    container_name: hoppscotch-sync
    restart: unless-stopped

    environment:
      - PROJECTS_DIR=/projects
      - HOPP_BACKEND=http://hoppscotch:80/backend
      - HOPP_EMAIL=admin@${DOMAIN}
      - MAILPIT_URL=http://mailer:8025
      - STATE_DIR=/state
      - EXCLUDE_PROJECTS=docker-master
      - TZ=Europe/Paris

    volumes:
      - ${PROJECTS_DIR}:/projects:ro
      - ./mnt/hoppscotch-sync/state:/state

    depends_on:
      - hoppscotch
      - mailer

    labels:
      - "dashboard.category=stack"

    networks:
      - bme_network

  hoppscotch-db:
    image: postgres:16-alpine
    container_name: hoppscotch-db
    restart: unless-stopped
    stop_grace_period: 1m

    environment:
      - POSTGRES_USER=hoppscotch
      - POSTGRES_PASSWORD=${HOPPSCOTCH_DB_PASSWORD}
      - POSTGRES_DB=hoppscotch

    volumes:
      - hoppscotch_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppscotch -d hoppscotch"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      # Même tag uniquement : un saut de version majeure de Postgres (16 -> 18)
      # ne lit pas les données existantes sans migration
      - "wud.tag.include=^16-alpine$$"
      - "wud.watch.digest=true"

    networks:
      - bme_network

  # Cache des images Docker Hub (pull-through) : chaque image n'est téléchargée
  # qu'une fois puis servie en local. La source est mirror.gcr.io, le miroir de
  # Docker Hub de Google, sans la limite anonyme (429) que l'IP partagée de
  # l'entreprise épuise vite. Le daemon Docker l'utilise via "registry-mirrors"
  # (make registry-mirror) et repasse par Docker Hub en direct si une image est
  # absente du miroir ou si le cache est arrêté.
  registry-cache:
    image: registry:3.1.2
    container_name: registry-cache
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      - REGISTRY_PROXY_REMOTEURL=https://mirror.gcr.io
      - REGISTRY_PROXY_TTL=168h
      - REGISTRY_LOG_LEVEL=info
      - OTEL_TRACES_EXPORTER=none

    volumes:
      - ./mnt/registry/data:/var/lib/registry

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 5s

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.tag.include=^3\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  # Simulation d'API externes. Les stubs sont des fichiers JSON versionnés dans
  # mnt/wiremock/mappings (réponses volumineuses dans mnt/wiremock/__files),
  # rechargés avec POST /__admin/mappings/reset. Les applis l'appellent en
  # interne sur http://wiremock:8080. Via Traefik, les mocks sont ouverts mais
  # l'API d'administration (/__admin) passe par le login unique.
  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock
    restart: unless-stopped

    command:
      - --global-response-templating
      - --disable-banner

    environment:
      # Fichiers de stubs créés via l'API au nom de l'utilisateur de l'hôte
      - uid=${UID:-1000}

    volumes:
      - ./mnt/wiremock/mappings:/home/wiremock/mappings
      - ./mnt/wiremock/__files:/home/wiremock/__files

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.wiremock.rule=Host(`${SUBDOMAIN}-wiremock.${DOMAIN}`)"
      - "traefik.http.routers.wiremock.entrypoints=websecure"
      - "traefik.http.routers.wiremock.tls=true"
      - "traefik.http.routers.wiremock.service=wiremock"
      - "traefik.http.routers.wiremock-admin.rule=Host(`${SUBDOMAIN}-wiremock.${DOMAIN}`) && PathPrefix(`/__admin`)"
      - "traefik.http.routers.wiremock-admin.entrypoints=websecure"
      - "traefik.http.routers.wiremock-admin.tls=true"
      - "traefik.http.routers.wiremock-admin.middlewares=tinyauth"
      - "traefik.http.routers.wiremock-admin.service=wiremock"
      - "traefik.http.services.wiremock.loadbalancer.server.port=8080"

      - "glance.name=WireMock"
      - "glance.icon=si:wiremock"
      - "glance.url=https://${SUBDOMAIN}-wiremock.${DOMAIN}/__admin/swagger-ui/"
      - "glance.description=API Mocks"
      - "glance.id=wiremock"

      - "wud.watch=true"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  # Surveillance des tâches planifiées : chaque tâche "pingue" son URL, une
  # alerte part (Mailpit) si le ping n'arrive pas à l'heure ou signale un échec.
  # Interface derrière le login unique (compte = e-mail transmis par tinyauth) ;
  # /ping et /api restent ouverts pour les tâches (l'API a ses propres clés).
  # Contrôles de la stack créés par : make healthchecks-init
  healthchecks:
    image: healthchecks/healthchecks:v4.4
    container_name: healthchecks
    restart: unless-stopped

    environment:
      - SECRET_KEY=${HEALTHCHECKS_SECRET_KEY}
      - SITE_ROOT=https://${SUBDOMAIN}-healthchecks.${DOMAIN}
      - SITE_NAME=Docker Master Healthchecks
      - ALLOWED_HOSTS=${SUBDOMAIN}-healthchecks.${DOMAIN},healthchecks
      - DB=sqlite
      - DB_NAME=/data/hc.sqlite
      - REGISTRATION_OPEN=False
      - REMOTE_USER_HEADER=HTTP_REMOTE_EMAIL
      - DEFAULT_FROM_EMAIL=healthchecks@docker-master.local
      - EMAIL_HOST=mailer
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - EMAIL_USE_VERIFICATION=False
      - INTEGRATIONS_ALLOW_PRIVATE_IPS=True
      # Derrière Traefik en HTTPS : sans cela, Django rejette les formulaires (CSRF)
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - TZ=Europe/Paris

    volumes:
      - healthchecks_data:/data

    depends_on:
      - mailer

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.healthchecks.rule=Host(`${SUBDOMAIN}-healthchecks.${DOMAIN}`)"
      - "traefik.http.routers.healthchecks.entrypoints=websecure"
      - "traefik.http.routers.healthchecks.tls=true"
      - "traefik.http.routers.healthchecks.middlewares=tinyauth"
      - "traefik.http.routers.healthchecks.service=healthchecks"
      - "traefik.http.routers.healthchecks-ping.rule=Host(`${SUBDOMAIN}-healthchecks.${DOMAIN}`) && (PathPrefix(`/ping/`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.healthchecks-ping.entrypoints=websecure"
      - "traefik.http.routers.healthchecks-ping.tls=true"
      - "traefik.http.routers.healthchecks-ping.service=healthchecks"
      - "traefik.http.services.healthchecks.loadbalancer.server.port=8000"

      - "glance.name=Healthchecks"
      - "glance.icon=si:healthchecksdotio"
      - "glance.url=https://${SUBDOMAIN}-healthchecks.${DOMAIN}"
      - "glance.description=Cron Monitoring"
      - "glance.id=healthchecks"

      - "wud.watch=true"
      - "wud.tag.include=^v\\d+\\.\\d+$$"

    networks:
      - bme_network

  # Gestion des projets Compose (éditer, démarrer, arrêter, mettre à jour).
  # Il voit les projets de PROJECTS_DIR via les liens de mnt/dockge/stacks
  # (make dockge-sync) : Dockge n'accepte que des noms en minuscules.
  # PROJECTS_DIR est monté au même chemin que sur l'hôte, pour que les chemins
  # relatifs des compose restent valides. Accès complet à Docker et écriture sur
  # tous les projets : derrière le login unique en plus de son propre compte.
  dockge:
    image: louislam/dockge:1.5.0
    container_name: dockge
    restart: unless-stopped

    environment:
      - DOCKGE_STACKS_DIR=${PROJECTS_DIR}/docker-master/mnt/dockge/stacks

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mnt/dockge/data:/app/data
      - ${PROJECTS_DIR}:${PROJECTS_DIR}

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.dockge.rule=Host(`${SUBDOMAIN}-dockge.${DOMAIN}`)"
      - "traefik.http.routers.dockge.entrypoints=websecure"
      - "traefik.http.routers.dockge.tls=true"
      - "traefik.http.routers.dockge.middlewares=tinyauth"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"

      - "glance.name=Dockge"
      - "glance.icon=si:docker"
      - "glance.url=https://${SUBDOMAIN}-dockge.${DOMAIN}"
      - "glance.description=Compose Stacks"
      - "glance.id=dockge"

      - "wud.watch=true"
      - "wud.tag.include=^1\\.\\d+\\.\\d+$$"

    networks:
      - bme_network

  # Dashboard Nuxt de la stack : état des services (lecture seule), actions
  # start/stop/restart via le proxy dédié, métriques, mises à jour WUD, sauvegardes.
  # Protégé par le login unique (tinyauth).
  dashboard:
    build: ./mnt/dashboard
    image: docker-master/dashboard:local
    container_name: dashboard
    restart: unless-stopped

    environment:
      - TZ=Europe/Paris
      - NUXT_WUD_PASSWORD=${WUD_ADMIN_PASSWORD:-admin}
      - NUXT_PUBLIC_WUD_PUBLIC_URL=https://${SUBDOMAIN}-wud.${DOMAIN}

    volumes:
      - ./mnt/restic/status:/status:ro

    depends_on:
      - docker-socket-proxy
      - docker-socket-proxy-actions

    labels:
      - "dashboard.category=stack"

      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${SUBDOMAIN}-dashboard.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.middlewares=tinyauth"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"

      - "glance.name=Dashboard"
      - "glance.icon=si:nuxt"
      - "glance.url=https://${SUBDOMAIN}-dashboard.${DOMAIN}"
      - "glance.description=Stack Dashboard"
      - "glance.id=dashboard"

    networks:
      - bme_network
      - socket_proxy
      - socket_proxy_actions

volumes:
  oracle_data:
  hoppscotch_db:
  healthchecks_data:
  prometheus_data:
  grafana_data:

networks:
  bme_network:
    external: true
  socket_proxy:
    internal: true
  socket_proxy_actions:
    internal: true
