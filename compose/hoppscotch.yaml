# Hoppscotch (client d'API), sa base et la synchro des fichiers .http.
# Assemblé par docker-compose.traefik.yaml (include) : chemins relatifs à la racine du dépôt.
services:
  # Client d'API (façon Postman). Tout est servi sur une URL : / (appli),
  # /admin (configuration : auth, SMTP → Mailpit) et /backend.
  # Les migrations de la base s'exécutent à chaque démarrage (idempotentes).
  hoppscotch:
    image: hoppscotch/hoppscotch:2026.9.0
    container_name: hoppscotch
    restart: unless-stopped
    entrypoint: ["tini", "--"]
    command:
      - sh
      - -c
      - cd /dist/backend && node node_modules/prisma/build/index.js migrate deploy && exec node /usr/src/app/aio_run.mjs

    environment:
      - DATABASE_URL=postgresql://hoppscotch:${HOPPSCOTCH_DB_PASSWORD}@hoppscotch-db:5432/hoppscotch
      - DATA_ENCRYPTION_KEY=${HOPPSCOTCH_ENCRYPTION_KEY}
      - ENABLE_SUBPATH_BASED_ACCESS=true
      - TRUST_PROXY=true
      - WHITELISTED_ORIGINS=https://${SUBDOMAIN}-hoppscotch.${DOMAIN},app://localhost_3200,app://hoppscotch
      - VITE_BASE_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}
      - VITE_SHORTCODE_BASE_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}
      - VITE_ADMIN_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/admin
      - VITE_BACKEND_GQL_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/graphql
      - VITE_BACKEND_WS_URL=wss://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/graphql
      - VITE_BACKEND_API_URL=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}/backend/v1

    depends_on:
      hoppscotch-db:
        condition: service_healthy

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.hoppscotch.rule=Host(`${SUBDOMAIN}-hoppscotch.${DOMAIN}`)"
      - "traefik.http.routers.hoppscotch.entrypoints=websecure"
      - "traefik.http.routers.hoppscotch.tls=true"
      - "traefik.http.services.hoppscotch.loadbalancer.server.port=80"

      - "glance.name=Hoppscotch"
      - "glance.icon=si:hoppscotch"
      - "glance.url=https://${SUBDOMAIN}-hoppscotch.${DOMAIN}"
      - "glance.description=API Client"
      - "glance.id=hoppscotch"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/hoppscotch.yaml"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  # Synchronisation continue des fichiers .http JetBrains des projets vers
  # Hoppscotch (sens unique : les fichiers font foi). Projets montés en lecture
  # seule ; session Hoppscotch de HOPP_EMAIL ouverte par lien magique lu dans
  # Mailpit. Ne touche qu'aux collections et environnements qu'il a créés.
  hoppscotch-sync:
    build: ./mnt/hoppscotch-sync
    image: docker-master/hoppscotch-sync:local
    container_name: hoppscotch-sync
    restart: unless-stopped

    environment:
      - PROJECTS_DIR=/projects
      - HOPP_BACKEND=http://hoppscotch:80/backend
      - HOPP_EMAIL=admin@${DOMAIN}
      - MAILPIT_URL=http://mailer:8025
      - STATE_DIR=/state
      - EXCLUDE_PROJECTS=docker-master
      - TZ=Europe/Paris

    volumes:
      - ${PROJECTS_DIR}:/projects:ro
      - ./mnt/hoppscotch-sync/state:/state

    depends_on:
      - hoppscotch
      - mailer

    labels:
      - "dashboard.category=stack"

    networks:
      - stack_network

  hoppscotch-db:
    image: postgres:16-alpine
    container_name: hoppscotch-db
    restart: unless-stopped
    stop_grace_period: 1m

    environment:
      - POSTGRES_USER=hoppscotch
      - POSTGRES_PASSWORD=${HOPPSCOTCH_DB_PASSWORD}
      - POSTGRES_DB=hoppscotch

    volumes:
      - hoppscotch_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppscotch -d hoppscotch"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/hoppscotch.yaml"
      # Même tag uniquement : un saut de version majeure de Postgres (16 -> 18)
      # ne lit pas les données existantes sans migration
      - "wud.tag.include=^16-alpine$$"
      - "wud.watch.digest=true"

    networks:
      - stack_network

networks:
  stack_network:
    name: ${STACK_NETWORK:-bme_network}
    external: true

volumes:
  hoppscotch_db:
