# Surveillance : métriques, logs, mises à jour, vulnérabilités, tâches planifiées.
# Assemblé par docker-compose.traefik.yaml (include) : chemins relatifs à la racine du dépôt.
services:
  # À la demande : Dozzle diffuse en continu les statistiques de tous les
  # conteneurs (~20 % de CPU pour dockerd et autant pour containerd), sans
  # option pour le couper. Hors du démarrage automatique (profil on-demand) :
  # à lancer depuis la page Services du dashboard, ou `make dozzle`.
  dozzle:
    image: amir20/dozzle:v10.3.0
    container_name: dozzle
    restart: "no"
    profiles: ["on-demand"]

    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DOZZLE_NO_ANALYTICS=true

    depends_on:
      - docker-socket-proxy

    labels:
      - "dashboard.category=tools"
      - "dashboard.on-demand=true"

      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${SUBDOMAIN}-dozzle.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.middlewares=tinyauth"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

      - "glance.name=Dozzle"
      - "glance.icon=si:docker"
      - "glance.url=https://${SUBDOMAIN}-dozzle.${DOMAIN}"
      - "glance.description=Docker Logs"
      - "glance.id=dozzle"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network
      - socket_proxy

  # Suivi et application des mises à jour d'images. Alerte dans Mailpit ;
  # la mise à jour se lance à la main (dashboard ou interface WUD, AUTO=false).
  # Mode rollback : WUD remplace seulement le tag dans le fichier du service
  # (label wud.compose.file, sans reformater le YAML), recrée le conteneur et
  # revient en arrière s'il n'est pas sain dans les 5 minutes.
  # Socket direct : pull + recréation = accès complet à l'API, un proxy
  # n'apporterait aucune restriction (même exception que Portainer).
  wud:
    image: getwud/wud:9.3.0
    container_name: wud
    restart: unless-stopped

    environment:
      - TZ=Europe/Paris
      - WUD_AUTH_ADMIN_USER=admin
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_ADMIN_PASSWORD:-admin}
      # Connexion via tinyauth (OIDC). Le compte local ci-dessus reste pour l'API (dashboard).
      - WUD_PUBLIC_URL=https://${SUBDOMAIN}-wud.${DOMAIN}
      - WUD_AUTH_OIDC_TINYAUTH_DISCOVERY=https://${SUBDOMAIN}-auth.${DOMAIN}/.well-known/openid-configuration
      - WUD_AUTH_OIDC_TINYAUTH_CLIENTID=wud
      - WUD_AUTH_OIDC_TINYAUTH_CLIENTSECRET=${TINYAUTH_OIDC_WUD_SECRET}
      - WUD_AUTH_OIDC_TINYAUTH_REDIRECT=true
      # Rôle admin pour l'utilisateur tinyauth "admin" (les comptes locaux de tinyauth
      # n'ont pas de groupes : le nom d'utilisateur sert de groupe) ; les autres sont refusés
      - WUD_AUTH_OIDC_TINYAUTH_GROUPSCLAIM=preferred_username
      - WUD_AUTH_OIDC_TINYAUTH_ADMINGROUP=admin
      - WUD_AUTH_OIDC_TINYAUTH_DEFAULTROLE=none
      - NODE_EXTRA_CA_CERTS=/certs-ca/ca.crt
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
      - WUD_WATCHER_LOCAL_CRON=${WUD_CRON:-0 12 * * *}
      - WUD_TRIGGER_SMTP_MAILPIT_HOST=mailer
      - WUD_TRIGGER_SMTP_MAILPIT_PORT=1025
      - WUD_TRIGGER_SMTP_MAILPIT_FROM_ADDRESS=wud@docker-master.local
      - WUD_TRIGGER_SMTP_MAILPIT_TO=dev@docker-master.local
      - WUD_TRIGGER_SMTP_MAILPIT_ALLOWCUSTOMTLD=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_FILE=/project/docker-compose.traefik.yaml
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_AUTO=false
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_BACKUP=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STACK_ROLLBACK=true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mnt/wud/store:/store
      # Autorité locale (certificat public seulement) pour joindre tinyauth en HTTPS
      - ./mnt/certs/ca/ca.crt:/certs-ca/ca.crt:ro
      - .:/project

    depends_on:
      - mailer

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`${SUBDOMAIN}-wud.${DOMAIN}`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.routers.wud.tls=true"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"

      - "glance.name=WUD"
      - "glance.icon=si:docker"
      - "glance.url=https://${SUBDOMAIN}-wud.${DOMAIN}"
      - "glance.description=Image Updates"
      - "glance.id=wud"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    # Plafond CPU : sans lui, cAdvisor a déjà saturé 4 cœurs sur 6 sous WSL
    cpus: 1.0

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--max_housekeeping_interval=60s"
      # Seuls CPU, mémoire et réseau servent (dashboard, Grafana). Le calcul de
      # l'espace disque des conteneurs (du sur chaque couche) est ruineux sous WSL.
      - "--disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"

    devices:
      - /dev/kmsg

    # Le healthcheck de l'image v0.60.6 passe à wget une option inconnue de BusyBox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    mem_limit: 64m

    command:
      - "--path.rootfs=/host"

    volumes:
      - /:/host:ro

    labels:
      - "dashboard.category=stack"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"

    volumes:
      - ./mnt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    labels:
      - "dashboard.category=stack"

      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${SUBDOMAIN}-prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=tinyauth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

      - "glance.name=Prometheus"
      - "glance.icon=si:prometheus"
      - "glance.url=https://${SUBDOMAIN}-prometheus.${DOMAIN}"
      - "glance.description=Metrics"
      - "glance.id=prometheus"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://${SUBDOMAIN}-grafana.${DOMAIN}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Login unique : Grafana fait confiance à l'utilisateur transmis par tinyauth
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true

    volumes:
      - ./mnt/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./mnt/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${SUBDOMAIN}-grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=tinyauth"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

      - "glance.name=Grafana"
      - "glance.icon=si:grafana"
      - "glance.url=https://${SUBDOMAIN}-grafana.${DOMAIN}"
      - "glance.description=Dashboards"
      - "glance.id=grafana"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"

    networks:
      - stack_network

  # Analyse de vulnérabilités des images en cours d'exécution, une fois par jour
  # (TRIVY_CRON) ou à la demande depuis le dashboard. Lit les images via le proxy
  # du socket en lecture seule ; la base de vulnérabilités vient de mirror.gcr.io.
  trivy:
    build: ./mnt/trivy
    image: docker-master/trivy:local
    container_name: trivy
    restart: unless-stopped
    # L'analyse d'une grosse image est gourmande : on laisse de la marge au reste
    cpus: 1.0
    mem_limit: 2g

    environment:
      - TZ=Europe/Paris
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - TRIVY_CACHE_DIR=/cache
      - TRIVY_CRON=${TRIVY_CRON:-0 13 * * *}

    volumes:
      - ./mnt/trivy/cache:/cache
      - ./mnt/trivy/status:/status
      - ./mnt/trivy/requests:/requests

    depends_on:
      - docker-socket-proxy

    labels:
      - "dashboard.category=stack"

    networks:
      - stack_network
      - socket_proxy

  # Surveillance des tâches planifiées : chaque tâche "pingue" son URL, une
  # alerte part (Mailpit) si le ping n'arrive pas à l'heure ou signale un échec.
  # Interface derrière le login unique (compte = e-mail transmis par tinyauth) ;
  # /ping et /api restent ouverts pour les tâches (l'API a ses propres clés).
  # Contrôles de la stack créés par : make healthchecks-init
  healthchecks:
    image: healthchecks/healthchecks:v4.4
    container_name: healthchecks
    restart: unless-stopped

    environment:
      - SECRET_KEY=${HEALTHCHECKS_SECRET_KEY}
      - SITE_ROOT=https://${SUBDOMAIN}-healthchecks.${DOMAIN}
      - SITE_NAME=Docker Master Healthchecks
      - ALLOWED_HOSTS=${SUBDOMAIN}-healthchecks.${DOMAIN},healthchecks
      - DB=sqlite
      - DB_NAME=/data/hc.sqlite
      - REGISTRATION_OPEN=False
      - REMOTE_USER_HEADER=HTTP_REMOTE_EMAIL
      - DEFAULT_FROM_EMAIL=healthchecks@docker-master.local
      - EMAIL_HOST=mailer
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - EMAIL_USE_VERIFICATION=False
      - INTEGRATIONS_ALLOW_PRIVATE_IPS=True
      # Derrière Traefik en HTTPS : sans cela, Django rejette les formulaires (CSRF)
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - TZ=Europe/Paris

    volumes:
      - healthchecks_data:/data

    depends_on:
      - mailer

    labels:
      - "dashboard.category=tools"

      - "traefik.enable=true"
      - "traefik.http.routers.healthchecks.rule=Host(`${SUBDOMAIN}-healthchecks.${DOMAIN}`)"
      - "traefik.http.routers.healthchecks.entrypoints=websecure"
      - "traefik.http.routers.healthchecks.tls=true"
      - "traefik.http.routers.healthchecks.middlewares=tinyauth"
      - "traefik.http.routers.healthchecks.service=healthchecks"
      - "traefik.http.routers.healthchecks-ping.rule=Host(`${SUBDOMAIN}-healthchecks.${DOMAIN}`) && (PathPrefix(`/ping/`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.healthchecks-ping.entrypoints=websecure"
      - "traefik.http.routers.healthchecks-ping.tls=true"
      - "traefik.http.routers.healthchecks-ping.service=healthchecks"
      - "traefik.http.services.healthchecks.loadbalancer.server.port=8000"

      - "glance.name=Healthchecks"
      - "glance.icon=si:healthchecksdotio"
      - "glance.url=https://${SUBDOMAIN}-healthchecks.${DOMAIN}"
      - "glance.description=Cron Monitoring"
      - "glance.id=healthchecks"

      - "wud.watch=true"
      - "wud.compose.file=/project/compose/monitoring.yaml"
      - "wud.tag.include=^v\\d+\\.\\d+$$"

    networks:
      - stack_network

networks:
  stack_network:
    name: ${STACK_NETWORK:-bme_network}
    external: true
  socket_proxy:
    internal: true

volumes:
  healthchecks_data:
  prometheus_data:
  grafana_data:
